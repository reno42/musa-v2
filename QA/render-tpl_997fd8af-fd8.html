: 140px;\n  background: radial-gradient(ellipse, rgba(0, 194, 255, 0.2), transparent 70%);\n  z-index: -1;\n}\n\n.cta-button {\n  display: inline-flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 18px;\n  background: linear-gradient(135deg, #00c2ff, #6366f1);\n  padding: 24px 40px;\n  border-radius: 60px;\n  text-decoration: none;\n  box-shadow: 0 8px 32px rgba(0, 194, 255, 0.35);\n  width: 100%;\n  max-width: 700px;\n  cursor: pointer;\n  transition: transform 0.2s ease;\n}\n\n.cta-button:hover {\n  transform: scale(1.02);\n}\n\n.cta-text {\n  color: #ffffff;\n  font-size: 28px;\n  font-weight: 800;\n  letter-spacing: -0.01em;\n}\n\n.cta-arrow {\n  color: #ffffff;\n  font-size: 28px;\n  opacity: 0.9;\n}\n\n.cta-sub {\n  margin-top: 22px;\n  font-size: 16px;\n  color: #6b7280;\n  letter-spacing: 0.02em;\n}\n\n.footer-bar {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-top: 30px;\n  padding-top: 24px;\n  border-top: 1px solid rgba(255, 255, 255, 0.08);\n  z-index: 2;\n  position: relative;\n}\n\n.footer-brand {\n  font-size: 15px;\n  font-weight: 600;\n  color: #6b7280;\n  letter-spacing: 0.04em;\n}\n\n.footer-link {\n  font-size: 15px;\n  color: #00c2ff;\n  text-decoration: none;\n  font-weight: 500;\n  opacity: 0.9;\n}"}];
    var total = frames.length;
    var done = 0;

    function renderNext(i) {
      if (i >= total) {
        document.getElementById('status').textContent = 'Done — ' + done + '/' + total + ' downloaded';
        document.getElementById('status').className = 'done';
        return;
      }
      var f = frames[i];
      document.getElementById('status').textContent = 'Rendering ' + (i+1) + '/' + total + ': ' + f.name + '…';

      var container = document.createElement('div');
      container.style.cssText = 'position:fixed;left:-9999px;top:0;width:'+f.width+'px;height:'+f.height+'px;overflow:hidden;';
      document.body.appendChild(container);

      var target = document.createElement('div');
      target.style.cssText = 'width:'+f.width+'px;height:'+f.height+'px;overflow:hidden;position:relative;';
      var style = document.createElement('style');
      style.textContent = f.css;
      target.appendChild(style);
      var content = document.createElement('div');
      content.innerHTML = f.html;
      target.appendChild(content);
      container.appendChild(target);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() { doCapture(target, f, container, i); });
      } else {
        setTimeout(function() { doCapture(target, f, container, i); }, 2000);
      }
    }

    function doCapture(target, f, container, i) {
      html2canvas(target, { width: f.width, height: f.height, scale: 2, useCORS: true, allowTaint: true }).then(function(canvas) {
        canvas.toBlob(function(blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = f.name + '.png';
          a.click();
          URL.revokeObjectURL(url);
          done++;
          container.remove();
          renderNext(i + 1);
        }, 'image/png');
      }).catch(function() {
        container.remove();
        renderNext(i + 1);
      });
    }

    renderNext(0);
  })();
