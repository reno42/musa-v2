k\">\n      <div class=\"cta-highlight\">Probalo en Futuraria Design</div>\n      <div class=\"cta-arrow\">→</div>\n    </div>\n  </div>\n\n  <div class=\"footer\">\n    <span>futuraria.design</span>\n    <div class=\"pagination\">\n      <span class=\"page-dot\"></span>\n      <span class=\"page-dot\"></span>\n      <span class=\"page-dot active\"></span>\n    </div>\n  </div>\n</div>","css":"@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\n.frame3 {\n  width: 1080px;\n  height: 1080px;\n  background: #f5f7fb;\n  font-family: 'Inter', sans-serif;\n  position: relative;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  padding: 48px 56px;\n}\n\n.bg-grid {\n  position: absolute;\n  top: 0;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  background-image:\n    linear-gradient(rgba(37, 99, 235, 0.04) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(37, 99, 235, 0.04) 1px, transparent 1px);\n  background-size: 32px 32px;\n  pointer-events: none;\n}\n\n.bg-glow {\n  position: absolute;\n  width: 400px;\n  height: 400px;\n  background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, transparent 70%);\n  top: 100px;\n  right: -80px;\n  pointer-events: none;\n}\n\n.top-bar {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  position: relative;\n  z-index: 2;\n  margin-bottom: 40px;\n}\n\n.logo {\n  width: 52px;\n  height: 52px;\n  background: linear-gradient(135deg, #2563eb, #7c3aed);\n  border-radius: 14px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 26px;\n  font-weight: 900;\n  color: #ffffff;\n}\n\n.brand-name {\n  font-size: 22px;\n  font-weight: 800;\n  color: #0f172a;\n  letter-spacing: -0.5px;\n}\n\n.badge {\n  background: #eef2ff;\n  color: #4338ca;\n  font-size: 14px;\n  font-weight: 700;\n  padding: 6px 14px;\n  border-radius: 20px;\n  margin-left: 6px;\n}\n\n.main-content {\n  position: relative;\n  z-index: 2;\n  display: flex;\n  flex-direction: column;\n  flex: 1;\n}\n\n.tag {\n  display: inline-block;\n  align-self: flex-start;\n  background: linear-gradient(135deg, #2563eb, #7c3aed);\n  color: #ffffff;\n  font-size: 14px;\n  font-weight: 700;\n  padding: 8px 20px;\n  border-radius: 20px;\n  letter-spacing: 0.3px;\n  margin-bottom: 20px;\n}\n\n.title {\n  font-size: 56px;\n  font-weight: 900;\n  color: #0f172a;\n  line-height: 1.1;\n  letter-spacing: -1.5px;\n  margin-bottom: 4px;\n}\n\n.subtitle {\n  font-size: 30px;\n  font-weight: 600;\n  color: #334155;\n  line-height: 1.3;\n  margin-bottom: 28px;\n}\n\n.benefit-grid {\n  display: flex;\n  gap: 16px;\n  margin-bottom: 28px;\n}\n\n.benefit-item {\n  background: #ffffff;\n  border-radius: 16px;\n  padding: 16px 18px;\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);\n  border: 1px solid #e2e8f0;\n  flex: 1;\n}\n\n.icon {\n  width: 36px;\n  height: 36px;\n  border-radius: 10px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 18px;\n  flex-shrink: 0;\n}\n\n.icon-1 {\n  background: #eff6ff;\n}\n\n.icon-2 {\n  background: #eef2ff;\n}\n\n.icon-3 {\n  background: #f5f3ff;\n}\n\n.benefit-text {\n  font-size: 16px;\n  font-weight: 600;\n  color: #1e293b;\n  line-height: 1.3;\n}\n\n.visual-card {\n  background: #ffffff;\n  border-radius: 18px;\n  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);\n  border: 1px solid #e2e8f0;\n  padding: 20px 24px;\n  margin-bottom: 32px;\n  max-width: 700px;\n}\n\n.visual-header {\n  display: flex;\n  gap: 6px;\n  margin-bottom: 18px;\n}\n\n.dot {\n  width: 10px;\n  height: 10px;\n  border-radius: 50%;\n}\n\n.dot-red {\n  background: #ef4444;\n}\n\n.dot-yellow {\n  background: #f59e0b;\n}\n\n.dot-green {\n  background: #22c55e;\n}\n\n.visual-body {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.visual-line {\n  height: 14px;\n  border-radius     var total = frames.length;
    var done = 0;

    function renderNext(i) {
      if (i >= total) {
        document.getElementById('status').textContent = 'Done — ' + done + '/' + total + ' downloaded';
        document.getElementById('status').className = 'done';
        return;
      }
      var f = frames[i];
      document.getElementById('status').textContent = 'Rendering ' + (i+1) + '/' + total + ': ' + f.name + '…';

      var container = document.createElement('div');
      container.style.cssText = 'position:fixed;left:-9999px;top:0;width:'+f.width+'px;height:'+f.height+'px;overflow:hidden;';
      document.body.appendChild(container);

      var target = document.createElement('div');
      target.style.cssText = 'width:'+f.width+'px;height:'+f.height+'px;overflow:hidden;position:relative;';
      var style = document.createElement('style');
      style.textContent = f.css;
      target.appendChild(style);
      var content = document.createElement('div');
      content.innerHTML = f.html;
      target.appendChild(content);
      container.appendChild(target);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() { doCapture(target, f, container, i); });
      } else {
        setTimeout(function() { doCapture(target, f, container, i); }, 2000);
      }
    }

    function doCapture(target, f, container, i) {
      html2canvas(target, { width: f.width, height: f.height, scale: 2, useCORS: true, allowTaint: true }).then(function(canvas) {
        canvas.toBlob(function(blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = f.name + '.png';
          a.click();
          URL.revokeObjectURL(url);
          done++;
          container.remove();
          renderNext(i + 1);
        }, 'image/png');
      }).catch(function() {
        container.remove();
        renderNext(i + 1);
      });
    }

    renderNext(0);
  })();
