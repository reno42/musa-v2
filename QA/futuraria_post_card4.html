<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Futuraria — Bootcamp IA × Ciencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 1080px;
      height: 1080px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: #0b1a35;
    }

    /* Blue gradient bg replacing video */
    .bg-blue {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 30% 20%, rgba(59,130,246,0.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(37,99,235,0.25) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(8,47,73,0.6) 0%, #0a1628 100%);
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(59,130,246,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.08) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse 70% 65% at 50% 45%, black 25%, transparent 70%);
    }

    .liquid-glass {
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.35) 0%,
        rgba(255,255,255,0.1) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.1) 80%,
        rgba(255,255,255,0.35) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .content-block {
      position: absolute;
      inset: 0;
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 10px 20px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 16px;
      color: rgba(255,255,255,0.75);
      align-self: flex-start;
    }

    .new-pill {
      background: #3b82f6;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 16px;
      padding: 5px 12px;
      border-radius: 6px;
      margin-right: 12px;
    }

    .headline-group {
      margin-top: 40px;
    }

    .headline {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 84px;
      line-height: 1.06;
      letter-spacing: -2.5px;
      color: #fff;
    }

    .italic-accent {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-style: italic;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    .copy {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 22px;
      line-height: 1.55;
      color: rgba(148,163,184,0.9);
      max-width: 560px;
      margin-top: 32px;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.35);
    }

    .divider {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(255,255,255,0.12), transparent);
    }

    .tag-label {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 18px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="bg-blue"></div>
    <div class="bg-grid"></div>

    <div class="content-block">
      <div>
        <div class="badge liquid-glass">
          <span class="new-pill">Nuevo</span> Bootcamp IA × Ciencia
        </div>

        <div class="headline-group">
          <div class="headline">De idea a producto</div>
          <div class="headline" style="margin-top:-4px">en <span class="italic-accent">5 semanas</span></div>
        </div>

        <div class="copy">
          37 modelos open-source. Todo ejecutable en Google Colab. $0 en herramientas. Salí con un prototipo funcional y un pitch para inversores.
        </div>
      </div>

      <div class="bottom-row">
        <div class="brand">FUTURARIA</div>
        <div class="divider"></div>
        <div class="tag-label">IA × Ciencia</div>
      </div>
    </div>
  </div>
</body>
</html>
