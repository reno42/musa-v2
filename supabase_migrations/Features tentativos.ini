## 🔥 Ideas que NINGUNA plataforma tiene (tu terreno)

1. **CSV → video paramétrico**: tu pipeline batch es único; extenderlo a video (50 reels con datos cambiados) es tuyo solo.
2. **Brand Guardian de VIDEO**: validar logo/paleta/contraste en cada shot de un clip. Nadie lo hace ni en estático tan integrado.
3. **Auto-reframe de diseño**: un post 1:1 → story 9:16 → banner, re-fluye con auto-layout IA (tu adapt_format + flex engine).
4. **Diff visual aceptar/rechazar** por cambio de IA (ya spec'd en J1 del plan): mata el miedo #1 a la IA.
5. **Timeline multi-agente**: 3 IAs editando segmentos distintos del mismo video con claim/lock (ya tienes claim_section).
6. **Second Brain de video**: grafo de escenas/shots consultable ("¿qué videos usaron este CTA?").
7. **Replicar reel**: pegas la URL de un reel → IA clona estructura de escenas a plantilla paramétrica tuya.
8. **Agentes que animan vía MCP**: `set_keyframe`, `create_motion` como tools — tus 287 tools crecen al motion sin UI extra.

