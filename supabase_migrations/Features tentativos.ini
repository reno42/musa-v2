## 🎥 Sobre el editor de video/motion: tu intuición es correcta y es MÁS barato de lo que crees

Tu ventaja estructural: **el motor ya renderiza HTML/CSS por frame**. Video = esos mismos frames animados en el tiempo. No partes de cero como CapCut o AE.

**Fase 1 — "Motion" MVP (4-6 semanas):**
- Timeline donde cada frame de Musa = un clip
- Keyframes de propiedades CSS (transform, opacity, color) con easings
- Preview con Web Animations API (seek preciso, gratis en tu motor)
- Export MP4/WebM client-side (WebCodecs — Chrome lo soporta hoy)
- Texto animado por carácter (CSS puro)

**Fase 2 — "Viral" (2-3 semanas más):**
- Auto-captions (Whisper API) con estilos de tus templates
- TTS + música con auto-cut al beat
- **Plantillas de motion paramétricas + CSV → 50 reels** (el diferenciador, nadie lo tiene)

**Fase 3 — "Higgsfield-like" (después):**
- Shots generados por IA con presets de cámara — es INTEGRACIÓN de APIs (Sora/Veo/Kling), no I+D propio. El costo es por segundo generado, no desarrollo.

**Lo que NO construir en v1**: compositing por nodos, tracking, partículas, expressions completas de AE. Eso son años de desarrollo y no es donde tus usuarios ganan velocidad.

**Veredicto de complejidad**: MVP de video = **mediana** (semanas gracias al motor HTML/CSS); paridad con AE = altísima (ni la intentes); paridad con CapCut para reels = totalmente alcanzable en 2 meses. Y en el único punto que importa —generación en lote paramétrico— **saldrías por delante de todos ellos**.