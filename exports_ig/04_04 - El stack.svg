<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@0,300;0,400;0,500;0,600;0,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fafffa}
.post{width:1080px;height:1920px;background:#fafffa;position:relative;overflow:hidden;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:56px 72px 0}
.wm{font-family:Inter,sans-serif;font-size:22px;font-weight:600}
.wm .n{color:#121613}.wm .f{color:#2bee4b}
.tag{font-family:Inter,sans-serif;font-size:18px;font-weight:400;color:#516254}
.content{padding:64px 72px 56px;flex:1;display:flex;flex-direction:column}
.content.center{align-items:center;text-align:center;justify-content:center}
h1{font-family:Playfair Display,Georgia,serif;font-weight:400;color:#121613;line-height:0.95}
h1.xl{font-size:96px;letter-spacing:-0.025em}
h1.lg{font-size:72px;letter-spacing:-0.02em}
h1.md{font-size:52px;letter-spacing:-0.015em}
h2{font-family:Playfair Display,Georgia,serif;font-size:42px;color:#121613;line-height:1.05;letter-spacing:-0.01em}
h3{font-family:Inter,sans-serif;font-size:18px;font-weight:600;color:#516254;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px}
p{font-family:Inter,sans-serif;font-size:22px;font-weight:350;color:#516254;line-height:1.45}
p strong{color:#121613;font-weight:550}
.tick{width:72px;height:3px;background:#2bee4b;margin-bottom:28px}
.tick.center{margin-left:auto;margin-right:auto}
.voltage{color:#2bee4b}
.italic{font-style:italic}
.bottombar{display:flex;justify-content:space-between;align-items:center;padding:36px 72px 52px;border-top:1px solid #c8d2c8}
.bottombar .cap{font-family:Georgia,serif;font-size:20px;font-style:italic;color:#516254}
.cta{display:inline-flex;align-items:center;gap:10px;background:#2bee4b;color:#000;font-family:Inter,sans-serif;font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:0.02em;padding:16px 40px;border-radius:14px;box-shadow:rgba(16,94,29,0.45) 1px 12px 28px 0px,rgba(18,146,39,0.25) 1px 12px 28px 0px}
.vt{position:absolute;width:54px;height:3px;background:#2bee4b}
.v-col{display:flex;flex-direction:column;gap:36px;margin-top:32px;flex:1}
.v-card{background:#fff;border:1px solid #c8d2c8;border-radius:18px;padding:36px 32px;display:flex;align-items:flex-start;gap:24px}
.v-icon{font-size:44px;min-width:60px;text-align:center;line-height:1}
.v-card h4{font-family:Playfair Display,Georgia,serif;font-size:29px;font-weight:400;color:#121613;margin-bottom:6px}
.v-card p{font-size:19px}
.v-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px;flex:1}
.v-box{background:#fff;border:1px solid #c8d2c8;border-radius:16px;padding:28px 24px;display:flex;flex-direction:column}
.v-num{font-family:Playfair Display,Georgia,serif;font-size:42px;color:#2bee4b;line-height:1;margin-bottom:6px}
.v-box h4{font-family:Playfair Display,Georgia,serif;font-size:26px;font-weight:400;color:#121613;margin-bottom:6px}
.v-box p{font-size:17px}
.stack-v{display:flex;flex-direction:column;gap:22px;margin-top:24px;flex:1}
.stack-row{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #c8d2c8;border-radius:14px;padding:20px 24px}
.stack-row .dot{width:10px;height:10px;border-radius:50%;background:#2bee4b;flex-shrink:0}
.stack-row .tt{font-family:Inter,sans-serif;font-size:20px;font-weight:600;color:#121613;min-width:140px}
.stack-row .dd{font-family:Inter,sans-serif;font-size:19px;color:#516254}
.big-stat{font-family:Playfair Display,Georgia,serif;font-size:140px;font-weight:400;color:#2bee4b;line-height:1;text-align:center}
.big-label{font-family:Inter,sans-serif;font-size:24px;font-weight:500;color:#121613;text-align:center;margin-top:8px}
.flow-compare{display:flex;gap:32px;margin-top:32px;flex:1}
.flow-half{flex:1;display:flex;flex-direction:column;gap:20px}
.flow-step{background:#fff;border:1px solid #c8d2c8;border-radius:12px;padding:18px 20px;font-family:Inter,sans-serif;font-size:18px;color:#121613;text-align:center}
.flow-step.bad{background:#fff5f5;border-color:#fecaca;color:#991b1b}
.flow-step.good{background:#f0fff4;border-color:#2bee4b}
.flow-label{font-family:Inter,sans-serif;font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#516254;margin-bottom:8px}
.flow-result{font-family:Inter,sans-serif;font-size:17px;text-align:center;padding:12px;font-weight:500}
.flow-result.bad{color:#991b1b}
.flow-result.good{color:#166534;font-weight:600}
.path-v{display:flex;flex-direction:column;gap:18px;margin-top:16px}
.path-step{display:flex;gap:16px;align-items:flex-start}
.path-num{font-family:Playfair Display,Georgia,serif;font-size:28px;color:#2bee4b;line-height:1;min-width:28px}
.path-step p{font-size:18px}
.cta-big{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:28px}
.email{font-family:Inter,sans-serif;font-size:26px;font-weight:500;color:#121613}]]></style></defs>
  <rect width="100%" height="100%" fill="#fafffa" />
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:1080px;height:1920px;position:relative;overflow:hidden;">
      <div class="post">
  <div class="topbar"><div class="wm"><span class="n">ADIS</span><span class="f">ruptive</span></div><div class="tag">Design Engineers</div></div>
  <div class="content">
    <h3>Herramientas 2026</h3>
    <h1 class="md">El stack de un<br><span class="italic voltage">Design Engineer</span></h1>
    <div class="tick"></div>
    <div class="stack-v">
      <div><h3 style="margin-bottom:12px">🏗️ Construir</h3>
        <div class="stack-row"><span class="dot"></span><span class="tt">n8n</span><span class="dd">Automatización</span></div>
        <div class="stack-row"><span class="dot"></span><span class="tt">Supabase</span><span class="dd">DB + Auth</span></div>
        <div class="stack-row"><span class="dot"></span><span class="tt">Netlify</span><span class="dd">Deploy</span></div>
      </div>
      <div><h3 style="margin-bottom:12px">🎨 Diseñar</h3>
        <div class="stack-row"><span class="dot"></span><span class="tt">Futuraria</span><span class="dd">Editor + MCP</span></div>
        <div class="stack-row"><span class="dot"></span><span class="tt">Fabric.js</span><span class="dd">Visual</span></div>
        <div class="stack-row"><span class="dot"></span><span class="tt">SVG/HTML</span><span class="dd">Precisión</span></div>
      </div>
      <div><h3 style="margin-bottom:12px">⚡ Operar</h3>
        <div class="stack-row"><span class="dot"></span><span class="tt">Agentes IA</span><span class="dd">Diatta</span></div>
        <div class="stack-row"><span class="dot"></span><span class="tt">MCP</span><span class="dd">Estándar abierto</span></div>
        <div class="stack-row"><span class="dot"></span><span class="tt">APIs</span><span class="dd">WhatsApp, Cal.com</span></div>
      </div>
    </div>
    <p style="margin-top:20px;text-align:center"><strong>La clave no es saber todas las herramientas. Es saber cuál usar para cada problema.</strong></p>
  </div>
  <div class="bottombar"><span class="cap">Design Engineers — IG Stories</span><span class="cap">4/5</span></div>
</div>
    </div>
  </foreignObject>
</svg>