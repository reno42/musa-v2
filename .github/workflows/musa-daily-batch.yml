# ═══════════════════════════════════════════════════════════════
# 🎨 Musa Daily Design Batch
# ═══════════════════════════════════════════════════════════════
#
# Runs daily at 9:00 UTC (6:00 AM Argentina Time).
# Also triggerable manually via GitHub Actions "Run workflow" button.
#
# Requires the following repository secrets:
#   MCP_API_KEY  — API key for the MCP endpoint (x-api-key header)
#
# The workflow calls process_daily_batch on the MCP server, which:
#   1. Reads all workspaces with auto_process_enabled = true
#   2. For each, processes pending task_queue items with tag "auto"
#   3. Calls the LLM to generate designs, creates templates, renders
#   4. Updates Kanban cards and sends Telegram notifications
# ═══════════════════════════════════════════════════════════════

name: 🎨 Musa Daily Design Batch

on:
  schedule:
    # 9:00 UTC = 6:00 AM America/Argentina/Buenos_Aires
    - cron: '0 9 * * *'
  workflow_dispatch:  # Manual trigger button

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max (way more than needed)

    steps:
      - name: Process daily batch
        env:
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          MCP_URL: https://design.futuraria.com/.netlify/functions/mcp
        run: |
          echo "🎨 Musa Daily Batch — $(date -u '+%Y-%m-%d %H:%M UTC')"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$MCP_URL" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $MCP_API_KEY" \
            -d '{"jsonrpc":"2.0","method":"process_daily_batch","params":{},"id":1}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Batch failed with HTTP $HTTP_CODE"
            exit 1
          fi

          # Extract summary from JSON-RPC response
          echo "$BODY" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              if 'error' in d:
                  print(f\"❌ MCP error: {d['error'].get('message', 'unknown')}\")
                  sys.exit(1)
              r = json.loads(d['result']['content'][0]['text'])
              summary = r.get('summary', {})
              ws = summary.get('workspaces', 0)
              ok = summary.get('totalSuccess', 0)
              fail = summary.get('totalFailed', 0)
              total = summary.get('total', 0)
              print(f'✅ Batch complete: {ok}/{total} designs created across {ws} workspace(s)')
              if fail > 0:
                  print(f'⚠️  {fail} items failed — check Kanban feedback column')
          except Exception as e:
              print(f'⚠️  Could not parse response: {e}')
          "
