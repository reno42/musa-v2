name = "musa-v2"
main = "worker/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# El sandbox de código de flows (flows-code-sandbox-edge.mjs) importa
# quickjs-ng como .wasm precompilado (import wasmModule from ".../wasm").
# Sin esta regla, wrangler 4.65 falla con "No loader is configured for
# .wasm files". CompiledWasm entrega un WebAssembly.Module, tal como el
# variant de quickjs lo espera.
rules = [
  { type = "CompiledWasm", globs = ["**/*.wasm"], fallthrough = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/mcp", "/api/*", "/oauth/*", "/.well-known/*", "/worker-health"]

# Cron trigger: webhook dispatch sweep + nightly maintenance (worker
# scheduled handler). Every 5 min it delivers pending outgoing webhooks
# and retries failed ones with exponential backoff — the demand check
# inside skips everything when nothing is due, so an idle platform pays a
# near-zero-duration invocation. The same tick runs the nightly
# maintenance (backups to the platform-backups bucket + trash sweep) with
# its own kill switches (BACKUPS_ENABLED / ORPHAN_SWEEP_ENABLED),
# independent of WEBHOOK_DISPATCH_SECRET. WEBHOOK_DISPATCH_SECRET must be
# set as a Worker secret or the webhook sweep no-ops.
# NOTA (decisión de producto): el server NO agenda flows — los horarios
# los ejecuta la IA del usuario (flow_due_check + flow_run desde su loop).
[triggers]
crons = ["*/5 * * * *"]

# Módulos no disponibles/pesados en Workers -> stubs que fallan limpio.
# sharp y undici ya degradan solos (try/catch o fetch nativo). PSD/PDF import deshabilitado en CF.
[alias]
"sharp" = "./worker/stubs/sharp-stub.js"
"@napi-rs/canvas" = "./worker/stubs/canvas-stub.js"
"pdfjs-dist" = "./worker/stubs/pdfjs-stub.js"
"undici" = "./worker/stubs/undici-stub.js"
"ag-psd" = "./worker/stubs/agpsd-stub.js"
"onnxruntime-web" = "./worker/stubs/onnx-stub.js"
"onnxruntime-common" = "./worker/stubs/onnx-stub.js"
"express" = "./worker/stubs/express-stub.js"
"cors" = "./worker/stubs/cors-stub.js"
"@jitl/quickjs-ng-wasmfile-release-sync/wasm" = "./worker/stubs/quickjs-wasm-module.js"

[observability]
enabled = true

[observability.traces]
enabled = true
