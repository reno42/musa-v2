name = "musa-v2"
account_id = "08c48f5a4b25a043559b1220da96e7ed"
main = "worker/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# Dominio propio: musaworks.com (zona agregada 2026-11-18, zone_id 84bf0c58ef843133538276bd02580800)
# Custom domains — wrangler emite el certificado SSL y crea los registros en la zona.
# workers_dev = true: mantener el workers.dev activo mientras la zona musaworks.com propaga.
workers_dev = true
routes = [
  { pattern = "musaworks.com", custom_domain = true },
  { pattern = "www.musaworks.com", custom_domain = true },
]

# El sandbox de código de flows (flows-code-sandbox-edge.mjs) importa
# quickjs-ng como .wasm precompilado (import wasmModule from ".../wasm").
# Sin esta regla, wrangler 4.65 falla con "No loader is configured for
# .wasm files". CompiledWasm entrega un WebAssembly.Module, tal como el
# variant de quickjs lo espera.
rules = [
  { type = "CompiledWasm", globs = ["**/*.wasm"], fallthrough = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# run_worker_first = true: TODAS las peticiones pasan primero por el worker.
# Necesario para el 404 real (rutas HTML fuera de la allowlist → 404.html) y
# para el auto-login/gates; sin esto, el asset handler del edge responde
# index.html (200) a cualquier ruta inventada antes de que el worker corra
# (misma lección que el gate de "/" y /rest/*). El worker hace passthrough a
# ASSETS para todo lo válido, así que el servir de assets no cambia.
run_worker_first = true

# Cron trigger: webhook dispatch sweep + nightly maintenance (worker
# scheduled handler). Every 5 min it delivers pending outgoing webhooks
# and retries failed ones with exponential backoff — the demand check
# inside skips everything when nothing is due, so an idle platform pays a
# near-zero-duration invocation. The same tick runs the nightly
# maintenance (backups to the platform-backups bucket + trash sweep) with
# its own kill switches (BACKUPS_ENABLED / ORPHAN_SWEEP_ENABLED),
# independent of WEBHOOK_DISPATCH_SECRET. WEBHOOK_DISPATCH_SECRET must be
# set as a Worker secret or the webhook sweep no-ops.
# NOTA (decisión de producto): el server NO agenda flows — los horarios
# los ejecuta la IA del usuario (flow_due_check + flow_run desde su loop).
[ai]
binding = "AI"

[triggers]
# REQ-076 (20-nov-2026): tick cada 5 min — sweep de webhooks + flows RESIDENTES
# (opt-in por flow: trigger.serverResident=true). La decisión del 2-nov se
# invierte con opt-in explícito: sin flows residentes el tick es 1-2 queries.
crons = ["*/5 * * * *"]

# Módulos no disponibles/pesados en Workers -> stubs que fallan limpio.
# sharp y undici ya degradan solos (try/catch o fetch nativo). PSD/PDF import deshabilitado en CF.
[alias]
"sharp" = "./worker/stubs/sharp-stub.js"
"@napi-rs/canvas" = "./worker/stubs/canvas-stub.js"
"pdfjs-dist" = "./worker/stubs/pdfjs-stub.js"
"undici" = "./worker/stubs/undici-stub.js"
"ag-psd" = "./worker/stubs/agpsd-stub.js"
"onnxruntime-web" = "./worker/stubs/onnx-stub.js"
"onnxruntime-common" = "./worker/stubs/onnx-stub.js"
"express" = "./worker/stubs/express-stub.js"
"cors" = "./worker/stubs/cors-stub.js"
"@jitl/quickjs-ng-wasmfile-release-sync/wasm" = "./worker/stubs/quickjs-wasm-module.js"

[observability]
enabled = true

[observability.traces]
enabled = true



# ── REQ-071 PENDIENTE 3 — backend Chatterbox (clones gratis) ──
# VOZ_BACKEND_SECRET va como SECRET (wrangler secret put VOZ_BACKEND_SECRET).
# VOZ_BACKEND_URL no es secreto (host:puerto del backend en Oracle A1).
# vars de R2 (R2_ACCOUNT_ID/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY) se comparten
# con r2-presign (ya existen como secrets del worker) + bucket musa-voz.

# REQ-segment: motor ONNX (sharp/u2netp) no corre en Workers (stubs). Cuando
# exista el backend dedicado (Eco/Oracle, patron VOZ_BACKEND), poner "backend"
# y dispatchSegmentJob lo apunta alli. Valores: off | edge | backend
[vars]
SEGMENT_ENGINE = "off"
