                    </a>


                    {/* ════════════════════════════════
                        HERO SECTION
                        Mantiene exactamente la estructura
                        y estética originales
                    ════════════════════════════════ */}
                    <section className="relative h-screen w-full flex-shrink-0 overflow-hidden">

                        {/* Capa 1 — Video de fondo */}
                        <div className="absolute inset-0 z-10">
                            <video autoPlay loop muted playsInline poster="https://qqqcmtwzyaejlzffivri.supabase.co/storage/v1/object/public/videos/thumbnail.jpg" className="w-full h-full object-cover object-center">
                                <source
                                    src="https://qqqcmtwzyaejlzffivri.supabase.co/storage/v1/object/public/videos/PerezBartraVideoFondo.mp4"
                                    type="video/mp4"
                                />
                            </video>
                            {/* Overlay para oscurecer el fondo y mejorar contraste */}
                            <div className="absolute inset-0 bg-black/40" />
                        </div>

                        {/* Capa 2 — Contenido sobre el video */}
                        <div className="absolute inset-0 z-30 pointer-events-none">

                            {/* TOP-LEFT: Logo + Tagline + Párrafos desktop */}
                            <motion.div
                                initial={{ opacity: 0, y: -20 }}
                                animate={{ opacity: 1, y: 0 }}
                                transition={{ duration: 1, ease: [0.16, 1, 0.3, 1] }}
                                className="absolute top-[24px] left-[20px] md:top-[64px] md:left-[64px] pointer-events-auto max-w-[calc(100vw-140px)] md:max-w-none"
                            >
                                <div className="flex flex-col gap-[20px] md:gap-[32px]">
                                    {/* Tagline bilingüe */}
                                    <div className="text-white text-[11px] md:text-[16px] w-[112px] md:w-auto leading-[1.2] font-semibold tracking-[0.02em]">
                                        {t.tagline.map((line, i) => (
                                            <span key={i} className="block">{line}</span>
                                        ))}
                                    </div>

                                    {/* Selector de idiomas — ahora aquí arriba */}
                                    <div className="lang-pill w-fit">
                                        <motion.button
                                            whileHover={{ scale: 1.05 }}
                                            whileTap={{ scale: 0.95 }}
                                            className={`lang-btn ${lang === 'en' ? 'active' : ''}`}
                                            onClick={() => { setLang('en'); document.documentElement.lang = 'en'; }}
                                        >EN</motion.button>
                                        <motion.button
                                            whileHover={{ scale: 1.05 }}
                                            whileTap={{ scale: 0.95 }}
                                            className={`lang-btn ${lang === 'es' ? 'active' : ''}`}
                                            onClick={() => { setLang('es'); document.documentElement.lang = 'es'; }}
                                        >ES</motion.button>
                                    </div>
                                </div>

                            </motion.div>

                            {/* Párrafos descriptivos — Desktop (ahora independientes para evitar el toggle) */}
                            <motion.div
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                transition={{ delay: 0.5, duration: 1 }}
                                className="hidden md:flex absolute bottom-[35px] left-[64px] flex-col gap-[24px] w-full max-w-[320px] text-white text-[14px] font-normal leading-relaxed pointer-events-auto"
                            >
                                <motion.p whileHover={{ color: "#fff", x: 4 }} transition={{ duration: 0.2 }}>{t.para1}</motion.p>
                                <motion.p whileHover={{ color: "#fff", x: 4 }} transition={{ duration: 0.2 }}>{t.para2}</motion.p>
                            </motion.div>

                            {/* TOP-RIGHT: CTA button → cal.com/futuraria/diagnostico */}
                            <motion.div
                                initial={{ x: 20 }}
                                animate={{ x: 0 }}
                                transition={{ duration: 0.8, ease: "easeOut" }}
                                className="absolute top-[20px] right-[20px] md:top-[32px] md:right-[64px] pointer-events-auto"
                            >
                                <motion.a
                                    whileHover={{ scale: 1.05, backgroundColor: "rgba(255, 255, 255, 0.15)" }}
                                    whileTap={{ scale: 0.98 }}
                                    href="https://cal.com/futuraria/diagnostico"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="block px-5 py-3 md:px-10 md:py-7 border border-white rounded-[100%] text-white text-[12px] md:text-[18px] font-italiana uppercase tracking-widest transition-colors duration-300 cursor-pointer cta-glass-fixed"
                                >
                                    {t.cta}
                                </motion.a>
                            </motion.div>

                            {/* BOTTOM: Heading principal */}
                            <motion.div
                                initial={{ opacity: 0, y: 40 }}
                                animate={{ opacity: 1, y: 0 }}
                                transition={{ duration: 1.2, ease: [0.16, 1, 0.3, 1] }}
                                className="absolute bottom-[84px] left-[20px] right-[20px] md:left-auto md:bottom-[64px] md:right-[64px] md:max-w-[1200px] text-left md:text-right pointer-events-auto flex flex-col md:block"
                            >
                                {/* Párrafos mobile — aparecen antes del heading */}
                                <div className="md:hidden flex flex-col gap-[16px] w-full max-w-[280px] text-white text-[12px] font-normal mb-[32px] text-left">
                                    <p className="leading-[16px]">{t.para1}</p>
                                    <p className="leading-[16px]">{t.para2}</p>
                                </div>

                                {/* Heading de 4 líneas en Italiana */}
                                <h1 className="text-white text-[36px] leading-[1.1] md:text-[96px] font-italiana md:leading-[88px] cursor-default">
                                    {/* Desktop y mobile comparten la misma estructura */}
                                    <span className="hidden md:block">
                                        {t.heading.map((line, i) => (
                                            <motion.span
                                                key={i}
                                                className="block"
                                                whileHover={{ x: 10, color: "rgba(255,255,255,0.8)" }}
                                                transition={{ duration: 0.4, ease: "easeOut" }}
                                            >
                                                {line}
                                            </motion.span>
                                        ))}
                                    </span>
                                    <span className="block md:hidden text-[32px]">
                                        {t.heading.map((line, i) => (
                                            <React.Fragment key={i}>
                                                {line}{i < t.heading.length - 1 && <br />}
                                            </React.Fragment>
                                        ))}
                                    </span>
                                </h1>
                            </motion.div>
                        </div>
                    </section>

                    {/* ════════════════════════════════
                        SERVICES SECTION
                        Grid 2×2 con glassmorphism cards
                        Cada card: pain → descripción → tags
                    ════════════════════════════════ */}
                    <section id="services" className="relative py-[80px] md:py-[120px] px-[20px] md:px-[64px]">

                        {/* Gradiente sutil para separar del hero */}
                        <div className="absolute inset-0 bg-gradient-to-b from-black via-[#070707] to-black pointer-events-none" />

                        <div className="relative z-10 max-w-[1400px] mx-auto">

                            {/* Header de sección */}
                            <motion.div
                                initial={{ opacity: 0, y: 20 }}
                                whileInView={{ opacity: 1, y: 0 }}
                                viewport={{ once: true }}
                                transition={{ duration: 0.8, ease: [0.16, 1, 0.3, 1] }}
                                className="mb-[64px] flex items-end justify-between"
                            >
                                <h2 className="text-white font-italiana text-[48px] md:text-[72px] leading-none">
                                    {t.servicesTitle}
                                </h2>
                                <span className="hidden md:block text-white/25 text-[14px] font-manrope max-w-[260px] text-right leading-relaxed">
                                    {t.servicesSubtitle}
                                </span>
                            </motion.div>

                            {/* Grid de servicios — 2 columnas en desktop, 1 en mobile */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-[16px] md:gap-[20px]">
                                {t.services.map((service, i) => (
                                    <ServiceCard
                                        key={`${lang}-${i}`}
                                        service={service}
                                        index={i}
                                        className={i === 4 ? "md:col-span-2" : ""}
                                    />
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* ════════════════════════════════
                        FOOTER
                        Glass card con CTA + datos de contacto
                    ════════════════════════════════ */}
                    <footer className="relative px-[20px] md:px-[64px] pb-[48px] pt-[40px]">
                        <div className="max-w-[1400px] mx-auto">

                            {/* Card principal con glassmorphism */}
                            <motion.div
                                initial={{ opacity: 0, y: 20 }}
                                whileInView={{ opacity: 1, y: 0 }}
                                viewport={{ once: true }}
                                transition={{ duration: 0.8 }}
                                className="glass rounded-[32px] p-[40px] md:p-[64px] flex flex-col md:flex-row items-start md:items-center justify-between gap-[40px]"
                            >
                                {/* Izquierda: logo + nombre + nota */}
                                <div className="flex flex-col gap-[16px]">
                                    <div>
                                        <p className="text-white font-manrope text-[15px] font-semibold leading-none">Renzo Pérez Bartra</p>
                                        <p className="text-white/40 font-manrope text-[12px] mt-[4px]">
                                            {t.footerRole.split('Futuraria')[0]}
                                            <motion.a
                                                whileHover={{ color: "#fff", x: 2 }}
                                                transition={{ duration: 0.2 }}
                                                href="https://www.futuraria.com"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="underline transition-colors inline-block"
                                            >
                                                Futuraria
                                            </motion.a>
                                            {t.footerRole.split('Futuraria')[1]}
                                        </p>
                                    </div>
                                    <p className="text-white/25 text-[12px] font-manrope leading-relaxed">{t.footerNote}</p>
                                </div>

                                {/* Derecha: CTA principal a cal.com */}
                                <motion.a
                                    whileHover={{ scale: 1.05, backgroundColor: "rgba(255, 255, 255, 0.1)" }}
                                    whileTap={{ scale: 0.98 }}
                                    href="https://cal.com/futuraria/diagnostico"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className={`inline-block px-[24px] py-[16px] md:px-[32px] border border-white/25 rounded-full text-white font-italiana tracking-widest transition-all duration-300 uppercase text-center max-w-full ${lang === 'es' ? 'text-[14px] sm:text-[18px] md:text-[22px]' : 'text-[18px] md:text-[22px]'} whitespace-normal md:whitespace-nowrap`}

                                >
                                    {t.footerCta}
                                </motion.a>
                            </motion.div>

                            {/* Línea legal inferior */}
                            <div className="flex items-center justify-between mt-[20px] px-[4px]">
                                <span className="text-white/18 text-[11px] font-manrope">{t.footerCopy}</span>
                                <span className="text-white/18 text-[11px] font-manrope">perezbartra.com</span>
                            </div>
                        </div>
                    </footer>

                </main>
            );
        }

        /* Montaje React */
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
