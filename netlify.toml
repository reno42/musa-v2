[build]
  command = "npm install && node scripts/prune-native-deps.mjs && npm run build:functions && npm run build"
  publish = "dist"

[build.environment]
  # Node >= 22 OBLIGATORIO: trae WebSocket nativo y Supabase Realtime lo
  # requiere en el server (en Node 20 el api function muere con
  # "Node.js 20 detected without native WebSocket support" → 502 en todo
  # /api/*). onnxruntime-web (WASM) corre igual en cualquier Node moderno.
  # Pre-arco de segmentación no había NODE_VERSION (default 22) y funcionaba.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # onnxruntime-web DEBE quedar externo: su entry "node" resuelve el glue
  # .mjs y el binario .wasm desde su propio directorio en disco, algo que el
  # bundle CJS de esbuild rompe (import.meta vacío → createRequire(undefined)
  # truena en frío). sharp es nativo y ya se marca externo solo. El prune
  # script deja en node_modules solo los archivos que la función usa.
  # OJO: la clave es external_node_modules (flat) — `external_modules` NO es
  # una propiedad de config: el parser la toma como nombre de función y falla
  # con "must be an object".
  external_node_modules = ["onnxruntime-web", "sharp", "@napi-rs/canvas", "pdfjs-dist"]

# Serve .well-known discovery files (mcp.json, robots.txt) as static assets
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/render/*"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/templates/*/render"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/templates/*/render/*"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/keys/*"
  to = "/.netlify/functions/keys"
  status = 200
  force = true

[[redirects]]
  from = "/api/keys"
  to = "/.netlify/functions/keys"
  status = 200
  force = true

[[redirects]]
  from = "/api/quiver/*"
  to = "/.netlify/functions/quiver-stream"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# ── OAuth 2.1 for MCP (REQ-012) ──
# Pretty URLs for the authorization server endpoints. 200-proxy (same
# pattern as /mcp) so GET (authorize pages) and POST (login/consent/
# token/register) both reach the functions.
[[redirects]]
  from = "/oauth/register"
  to = "/.netlify/functions/oauth-register"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/authorize"
  to = "/.netlify/functions/oauth-authorize"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/token"
  to = "/.netlify/functions/oauth-token"
  status = 200
  force = true

[[redirects]]
  from = "/harness-cron"
  to = "/.netlify/functions/harness-cron"
  status = 200
  force = true

# Scheduled function: runs the harness cron every hour to process due cronjobs.
# Each cronjob schedules its own tasks via the harness_cronjobs table.
[functions.harness-cron]
  schedule = "0 * * * *"

# Scheduled function: Musa batch hourly TICK — a lightweight dispatcher.
# Scheduled functions are capped at 30s and cannot be invoked by URL, so
# the tick never runs the pipeline itself: it just POSTs to the
# musa-batch BACKGROUND function (below) and exits in well under a
# second. Hourly cadence = self-healing after outages that outlast the
# background function's native retries (1 min → 2 min).
[functions.musa-batch-tick]
  schedule = "0 * * * *"

# Background function: the real Musa batch pipeline (leader →
# implementer → reviewer over enabled Kanban cards). Background mode is
# opted in by the FILENAME SUFFIX "-background" (netlify/functions/
# musa-batch-background.mjs) — Netlify's actual mechanism. (The v2.2
# `[functions.musa-batch] background = true` key was a no-op: the
# function answered synchronously, caller fetch-aborts killed long runs
# mid-LLM, and multi-frame generations never finished.) URL-invocable —
# callers get an immediate empty 202 while it runs — with a 15-minute
# execution limit. Consumers: the hourly musa-batch-tick and the Kanban
# "Ejecutar batch" button (mcp.mjs musa_batch_run) — both send
# x-batch-secret (MUSA_BATCH_SECRET) and validate the 202.
# Credits: background functions bill execution time; a run with no
# pending cards finishes in seconds, so 24 hourly ticks/day stay cheap.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# OAuth discovery files have NO file extension — without these rules
# Netlify serves them as application/octet-stream and some MCP clients
# refuse to parse them.
[[headers]]
  for = "/.well-known/oauth-protected-resource"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/.well-known/oauth-authorization-server"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=300"
