[build]
  command = "npm install && npm run build:functions && npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Serve .well-known discovery files (mcp.json, robots.txt) as static assets
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/render/*"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/templates/*/render"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/templates/*/render/*"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/keys/*"
  to = "/.netlify/functions/keys"
  status = 200
  force = true

[[redirects]]
  from = "/api/keys"
  to = "/.netlify/functions/keys"
  status = 200
  force = true

[[redirects]]
  from = "/api/quiver/*"
  to = "/.netlify/functions/quiver-stream"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/harness-cron"
  to = "/.netlify/functions/harness-cron"
  status = 200
  force = true

# Scheduled function: runs the harness cron every hour to process due cronjobs.
# Each cronjob schedules its own tasks via the harness_cronjobs table.
[functions.harness-cron]
  schedule = "0 * * * *"

# Scheduled function: Musa batch hourly TICK — a lightweight dispatcher.
# Scheduled functions are capped at 30s and cannot be invoked by URL, so
# the tick never runs the pipeline itself: it just POSTs to the
# musa-batch BACKGROUND function (below) and exits in well under a
# second. Hourly cadence = self-healing after outages that outlast the
# background function's native retries (1 min → 2 min).
[functions.musa-batch-tick]
  schedule = "0 * * * *"

# Background function: the real Musa batch pipeline (leader →
# implementer → reviewer over enabled Kanban cards). Background mode is
# opted in by the FILENAME SUFFIX "-background" (netlify/functions/
# musa-batch-background.mjs) — Netlify's actual mechanism. (The v2.2
# `[functions.musa-batch] background = true` key was a no-op: the
# function answered synchronously, caller fetch-aborts killed long runs
# mid-LLM, and multi-frame generations never finished.) URL-invocable —
# callers get an immediate empty 202 while it runs — with a 15-minute
# execution limit. Consumers: the hourly musa-batch-tick and the Kanban
# "Ejecutar batch" button (mcp.mjs musa_batch_run) — both send
# x-batch-secret (MUSA_BATCH_SECRET) and validate the 202.
# Credits: background functions bill execution time; a run with no
# pending cards finishes in seconds, so 24 hourly ticks/day stay cheap.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
