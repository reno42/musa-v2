[build]
  command = "npm install && npm run build:functions && npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Serve .well-known discovery files (mcp.json, robots.txt) as static assets
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/render/*"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/templates/*/render"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/templates/*/render/*"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/keys/*"
  to = "/.netlify/functions/keys"
  status = 200
  force = true

[[redirects]]
  from = "/api/keys"
  to = "/.netlify/functions/keys"
  status = 200
  force = true

[[redirects]]
  from = "/api/quiver/*"
  to = "/.netlify/functions/quiver-stream"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/harness-cron"
  to = "/.netlify/functions/harness-cron"
  status = 200
  force = true

# Scheduled function: runs the harness cron every hour to process due cronjobs.
# Each cronjob schedules its own tasks via the harness_cronjobs table.
[functions.harness-cron]
  schedule = "0 * * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
