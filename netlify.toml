[build]
  command = "npm install && npm run build:functions && npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/render/*"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/templates/*/render"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/templates/*/render/*"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
